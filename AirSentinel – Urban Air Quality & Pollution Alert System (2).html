<style>

const CITIES={"Delhi":[28.61,77.2,120,24,45,"India"],"Mumbai":[19.08,72.88,65,29,70,"India"],"Chennai":[13.08,80.27,55,31,72,"India"],"Bengaluru":[12.97,77.59,40,25,60,"India"],"Kolkata":[22.57,88.36,95,28,70,"India"],"Hyderabad":[17.39,78.49,58,27,55,"India"],"Pune":[18.52,73.86,55,26,55,"India"],"Ahmedabad":[23.02,72.57,80,30,50,"India"],"Jaipur":[26.91,75.79,85,28,42,"India"],"Lucknow":[26.85,80.95,110,26,55,"India"],"Kanpur":[26.45,80.33,115,26,52,"India"],"Patna":[25.59,85.14,105,27,60,"India"],"Coimbatore":[11.0,76.96,38,27,60,"India"],"Madurai":[9.92,78.12,45,30,58,"India"],"Tiruchirappalli":[10.79,78.7,48,30,58,"India"],"Karur":[10.96,78.08,42,31,58,"India"],"Beijing":[39.9,116.4,90,15,50,"Asia & Middle East"],"Shanghai":[31.23,121.47,55,17,70,"Asia & Middle East"],"Tokyo":[35.68,139.69,25,16,62,"Asia & Middle East"],"Seoul":[37.57,126.98,40,13,58,"Asia & Middle East"],"Bangkok":[13.76,100.5,50,30,72,"Asia & Middle East"],"Jakarta":[-6.2,106.85,60,28,78,"Asia & Middle East"],"Singapore":[1.35,103.82,20,28,80,"Asia & Middle East"],"Dubai":[25.2,55.27,50,33,55,"Asia & Middle East"],"Karachi":[24.86,67.0,95,28,65,"Asia & Middle East"],"Lahore":[31.55,74.34,110,25,50,"Asia & Middle East"],"Dhaka":[23.81,90.41,115,27,72,"Asia & Middle East"],"Colombo":[6.93,79.86,35,28,78,"Asia & Middle East"],"London":[51.5,-0.12,22,13,75,"Europe"],"Paris":[48.86,2.35,18,12,72,"Europe"],"Berlin":[52.52,13.4,14,10,72,"Europe"],"Madrid":[40.42,-3.7,15,15,55,"Europe"],"Rome":[41.9,12.5,20,16,62,"Europe"],"Moscow":[55.76,37.62,18,6,72,"Europe"],"Los Angeles":[34.05,-118.24,38,22,55,"Americas"],"New York":[40.71,-74.0,15,13,62,"Americas"],"Chicago":[41.88,-87.63,14,10,68,"Americas"],"Toronto":[43.65,-79.38,10,9,68,"Americas"],"Mexico City":[19.43,-99.13,35,17,55,"Americas"],"São Paulo":[-23.55,-46.63,25,21,70,"Americas"],"Cairo":[30.04,31.24,70,25,45,"Africa & Oceania"],"Lagos":[6.52,3.38,60,29,78,"Africa & Oceania"],"Nairobi":[-1.29,36.82,25,19,62,"Africa & Oceania"],"Johannesburg":[-26.2,28.05,28,17,50,"Africa & Oceania"],"Sydney":[-33.87,151.21,10,18,65,"Africa & Oceania"]};
const ZF={traffic:1.25,industrial:1.45,residential:1,green:.6,commercial:1.1},ZN=Object.keys(ZF);
const BP={pm25:[[0,12,0,50],[12.1,35.4,51,100],[35.5,55.4,101,150],[55.5,150.4,151,200],[150.5,250.4,201,300],[250.5,500,301,500]],pm10:[[0,54,0,50],[55,154,51,100],[155,254,101,150],[255,354,151,200],[355,424,201,300],[425,604,301,500]],co:[[0,4.4,0,50],[4.5,9.4,51,100],[9.5,12.4,101,150],[12.5,15.4,151,200],[15.5,30.4,201,300],[30.5,50.4,301,500]],no2:[[0,53,0,50],[54,100,51,100],[101,360,101,150],[361,649,151,200],[650,1249,201,300],[1250,2049,301,500]]};

function sub(p,c){c=(p=="pm25"||p=="co")?Math.floor(c*10)/10:Math.floor(c);for(const[l,h,il,ih]of BP[p])if(c<=h)return Math.round((ih-il)/(h-l)*(Math.max(c,l)-l)+il);return 500}

const o={pm25:+f(pm25,1),pm10:+f(pm10,1),co:+f(co,2),no2:+f(no2,1)};rows.push({loc:{id:r*5+c,name:z[0].toUpperCase()+z.slice(1)+" "+(r+1)+"-"+(c+1),zone:z,r,c},ts:x.ts,...o,...calc(o),temp:+f(x.t,1),hum:+f(x.h),wind:+f(x.w,1),dir:Math.round(x.dir)})}});return rows}
const DB=new Promise(r=>{try{const q=indexedDB.open("airsentinel",1);q.onupgradeneeded=()=>q.result.createObjectStore("d");q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const dbGet=async k=>{const d=await DB;return d?new Promise(r=>{try{const q=d.transaction("d").objectStore("d").get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}}):null};
const dbSet=async(k,v)=>{const d=await DB;if(d)try{d.transaction("d","readwrite").objectStore("d").put(v,k)}catch(e){}};
const CU=ls("as_custom",{});Object.assign(CITIES,CU);
const S={city:ls("as_city","Karur"),thr:ls("as_thr",150),alerts:ls("as_alerts",[]),tab:"dash",layer:"aqi",zone:"all",sel:null,rows:[],H:[],cache:{}};
const TABS=[["dash","Dashboard"],["all","All cities"],["map","Hotspot map"],["fc","Forecast"],["wx","Weather impact"],["al","Alerts"],["data","Data"]];
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length,latest=()=>S.rows.slice(-25);
function derive(){S.H=[];for(let i=0;i<72;i++){const g=S.rows.slice(i*25,i*25+25),o={};["pm25","pm10","co","no2","temp","hum","wind"].forEach(k=>o[k]=mean(g.map(r=>r[k])));o.dir=g[0].dir;o.ts=g[0].ts;o.hr=new Date(g[0].ts).getHours();Object.assign(o,calc(o));S.H.push(o)}}
function model(y,hrs,K){const m=mean(y),d={},n={};y.forEach((v,i)=>{const h=hrs[i];d[h]=(d[h]||0)+v-m;n[h]=(n[h]||0)+1});for(const h in d)d[h]/=n[h];const l=y.at(-1),hl=hrs.at(-1);return Array.from({length:K},(_,k)=>{const h=(hl+k+1)%24;return Math.max(0,m+(d[h]||0)+(l-m-(d[hl]||0))*Math.pow(.8,k+1))})}

const chip=a=>`<span class="chip" style="background:${cat(a)[2]}">${a} · ${cat(a)[1]}</span>`;
function spark(a,c="var(--ac)"){const mn=Math.min(...a),mx=Math.max(...a)||1,p=a.map((v,i)=>(i*100/(a.length-1)).toFixed(1)+","+(28-(v-mn)/((mx-mn)||1)*26).toFixed(1)).join(" ");return`<svg viewBox="0 0 100 30" width="100%" height="30" preserveAspectRatio="none"><polyline points="${p}" fill="none" stroke="${c}" stroke-width="1.6"/></svg>`}
function chart(hist,F,thr){const W=640,Hh=250,p=34,n=hist.length+12,all=[...hist,...F.hi,...F.lo],mx=Math.max(...all,thr)*1.1,mn=0,X=i=>p+i*(W-p*1.6)/(n-1),Y=v=>Hh-p-(v-mn)/(mx-mn)*(Hh-p*1.6),o=hist.length-1;

const V={
dash(){const L=latest(),c=S.H.at(-1),k=cat(c.aqi),len=282.7,off=len*(1-Math.min(c.aqi,300)/300),m=S.H.slice(-24);

return`<div class="card sc"><h3>${R.length} monitored cities, ranked by current AQI. Click a row to open that city.</h3><table><tr><th>#</th><th>City</th><th>Region</th><th>AQI</th><th>Main pollutant</th><th>PM2.5 µg/m³</th><th>Hotspot areas (of 25)</th></tr>${R.map((r,i)=>`<tr data-c="${r.c}" style="cursor:pointer;${r.c==S.city?"background:var(--c2)":""}"><td>${i+1}</td><td><b>${r.c}</b></td><td>${r.reg}</td><td>${chip(r.aqi)}</td><td>${LBL[r.dom]}</td><td>${f(r.pm,1)}</td><td>${r.n}</td></tr>`).join("")}</table></div>`},
map(){const opts=["aqi","pm25","pm10","no2","co"].map(p=>`<option value="${p}" ${S.layer==p?"selected":""}>${p=="aqi"?"AQI":LBL[p]}</option>`).join("");const L=latest(),a=L.map(r=>r.aqi),mu=mean(a),sd=Math.sqrt(mean(a.map(v=>(v-mu)**2))),hot=L.filter(r=>r.aqi>mu+sd||r.aqi>150).length,s=S.sel,r=s!=null?L[s]:null;
return`<div class="g g2"><div class="card"><h3>Hotspot heatmap <select id="layer" style="float:right">${opts}</select></h3><canvas id="cv" width="560" height="560"></canvas><p class="sm mu">A 5×5 grid covers the city. Click an area for details.</p></div><div class="card"><h3>${r?r.loc.name:"Area details"}</h3>${r?`<div class="big" style="color:${cat(r.aqi)[2]}">${r.aqi}</div><p>${cat(r.aqi)[1]} · zone: ${r.loc.zone}</p><table><tr><td>PM2.5</td><td>${r.pm25} µg/m³</td></tr><tr><td>PM10</td><td>${r.pm10} µg/m³</td></tr><tr><td>NO₂</td><td>${r.no2} ppb</td></tr><tr><td>CO</td><td>${r.co} ppm</td></tr></table><p class="sm">${cat(r.aqi)[3]}</p>`:`<p class="mu">Select a cell on the map.</p>`}<p class="sm mu">Hotspot rule: AQI above city average + 1 standard deviation, or above 150. <b>${hot}</b> hotspot areas now.</p></div></div>`},
fc(){const F=forecast(),y=S.H.map(h=>h.aqi),cur=y.at(-1),av=mean(F.p.slice(0,6)),tr=av>cur*1.08?["Worsening","#ef4444"]:av<cur*.92?["Improving","#22c55e"]:["Stable","#eab308"],last=S.H.at(-1).ts,rel=Math.max(0,100-F.mae/Math.max(cur,1)*100);
return`<div class="g g4"><div class="card"><h3>Trend (next 6 h)</h3><div class="big" style="color:${tr[1]}">${tr[0]}</div></div><div class="card"><h3>Peak forecast</h3><div class="big">${Math.round(Math.max(...F.p))}</div></div><div class="card"><h3>Back-test MAE</h3><div class="big">${f(F.mae,1)}</div><span class="sm mu">AQI points, last 12 h</span></div><div class="card"><h3>Reliability</h3><div class="big">${f(rel)}%</div></div></div>
<div class="card" style="margin:14px 0"><h3>72 h history and 12 h forecast (dashed, shaded = confidence)</h3>${chart(y,F,S.thr)}</div>
<div class="card sc"><h3>Next 12 hours</h3><table><tr>${F.p.map((v,i)=>`<th>${new Date(last+(i+1)*36e5).getHours()}:00</th>`).join("")}</tr><tr>${F.p.map(v=>`<td><span class="chip" style="background:${cat(v)[2]}">${Math.round(v)}</span></td>`).join("")}</tr></table><p class="sm mu">Method: seasonal hour-of-day profile plus a decaying momentum term, back-tested on held-out hours.</p></div>`},
wx(){const p=S.H.map(h=>h.pm25),F=[["Wind speed","wind"],["Humidity","hum"],["Temperature","temp"]].map(([n,k])=>[n,k,pear(p,S.H.map(h=>h[k]))]),c=S.H.at(-1),up=(c.pm25/mean(p)-1)*100,ins=[];
if(c.wind<6)ins.push(`Low wind (${f(c.wind,1)} km/h) is trapping pollutants. PM2.5 is ${f(Math.abs(up))}% ${up>=0?"above":"below"} the 72 h average.`);else ins.push(`Wind of ${f(c.wind,1)} km/h is helping disperse pollutants.`);
if(c.hum>70)ins.push(`High humidity (${f(c.hum)}%) lets fine particles build up.`);
ins.push(`Pollution is drifting toward the ${comp((c.dir+180)%360)} (wind from ${comp(c.dir)}).`);
F.forEach(([n,k,r])=>ins.push(`${n} vs PM2.5: r = ${f(r,2)} (${Math.abs(r)<.2?"weak":Math.abs(r)<.5?"moderate":"strong"} ${r<0?"negative":"positive"} link).`));
const bars=F.map(([n,k,r])=>`<div style="margin:12px 0"><div class="sm">${n} <b>r = ${f(r,2)}</b></div><div class="bar"><i style="left:${r<0?50+r*50:50}%;width:${Math.abs(r)*50}%;background:${r<0?"#22c55e":"#f97316"}"></i></div></div>`).join("");
const sc=(k,col)=>{const xs=S.H.map(h=>h[k]),mn=Math.min(...xs),mx=Math.max(...xs),py=Math.max(...p);return`<svg viewBox="0 0 200 120" width="100%">${S.H.map((h,i)=>`<circle cx="${8+(xs[i]-mn)/((mx-mn)||1)*184}" cy="${110-p[i]/py*100}" r="2.6" fill="${col}" opacity=".7"/>`).join("")}<text x="8" y="119">${k=="wind"?"wind speed":k=="hum"?"humidity":"temperature"} →</text></svg>`};
return`<div class="g g2"><div class="card"><h3>Correlation with PM2.5</h3>${bars}<p class="sm mu">Green = weather lowers pollution, orange = raises it.</p></div><div class="card"><h3>Insights</h3>${ins.map(t=>`<div class="al" style="border-color:var(--ac)">${t}</div>`).join("")}</div></div><div class="g g4" style="margin-top:14px"><div class="card"><h3>PM2.5 vs wind</h3>${sc("wind","#22d3ee")}</div><div class="card"><h3>PM2.5 vs humidity</h3>${sc("hum","#a855f7")}</div><div class="card"><h3>PM2.5 vs temperature</h3>${sc("temp","#f97316")}</div></div>`},
al(){const cl=l=>l=="Danger"?"#ef4444":l=="Warning"?"#f97316":"#22d3ee";
return`<div class="g g2"><div class="card"><h3>Alert settings</h3><label>Alert me when AQI reaches <b id="tv">${S.thr}</b></label><input id="thr" type="range" min="50" max="300" step="10" value="${S.thr}" style="width:100%;padding:0"><p class="sm mu">Location-based alerts fire for the top areas above this level and for forecasts that cross it.</p><button id="nt">Enable browser notifications</button> <button id="clr">Clear history</button></div><div class="card"><h3>Alert history (${S.alerts.length})</h3>${S.alerts.length?S.alerts.map(a=>`<div class="al" style="border-color:${cl(a.lvl)}"><b>${a.lvl}</b> · <span class="sm mu">${new Date(a.ts).toLocaleString()}</span><br>${a.msg}<br><span class="sm mu">${a.rec}</span></div>`).join(""):`<p class="mu">No alerts yet. Lower the threshold or press "Simulate pollution event".</p>`}</div></div>`},
data(){const L=latest().filter(r=>S.zone=="all"||r.loc.zone==S.zone).sort((a,b)=>b.aqi-a.aqi),pm=S.rows.map(r=>r.pm25),mu=mean(pm),sd=Math.sqrt(mean(pm.map(v=>(v-mu)**2))),out=pm.filter(v=>Math.abs(v-mu)>3*sd).length;
return`<div class="g g4"><div class="card"><h3>Rows in browser database</h3><div class="big">${S.rows.length.toLocaleString()}</div></div><div class="card"><h3>Coverage</h3><div class="sm">25 areas × 72 hourly readings<br>${new Date(S.rows[0].ts).toLocaleDateString()} – ${new Date(S.rows.at(-1).ts).toLocaleDateString()}</div></div><div class="card"><h3>Missing values</h3><div class="big">0%</div></div><div class="card"><h3>Flagged outliers</h3><div class="big">${out}</div><span class="sm mu">PM2.5 beyond 3σ</span></div></div>
<div class="card sc" style="margin-top:14px"><h3>Latest readings <select id="zone">${["all",...ZN].map(z=>`<option ${S.zone==z?"selected":""}>${z}</option>`).join("")}</select> <button id="cp">Copy CSV</button></h3><table><tr><th>Area</th><th>Zone</th><th>AQI</th><th>PM2.5</th><th>PM10</th><th>NO₂</th><th>CO</th><th>Temp °C</th><th>Humidity %</th><th>Wind km/h</th></tr>${L.map(r=>`<tr><td>${r.loc.name}</td><td>${r.loc.zone}</td><td>${chip(r.aqi)}</td><td>${r.pm25}</td><td>${r.pm10}</td><td>${r.no2}</td><td>${r.co}</td><td>${r.temp}</td><td>${r.hum}</td><td>${r.wind}</td></tr>`).join("")}</table><p class="sm mu">Data is simulated (seeded, realistic rush-hour, weather and zone effects) and stored in this browser's IndexedDB. AQI uses US EPA breakpoints.</p></div>`}};
function draw(){const cv=$("#cv");if(!cv)return;const x=cv.getContext("2d"),L=latest(),s=cv.width/5,st=getComputedStyle(document.documentElement);x.fillStyle=st.getPropertyValue("--c2");x.fillRect(0,0,560,560);
const val=r=>S.layer=="aqi"?r.aqi:sub(S.layer,r[S.layer]);L.forEach(r=>{const cx=(r.loc.c+.5)*s,cy=(r.loc.r+.5)*s,col=cat(val(r))[2],g=x.createRadialGradient(cx,cy,4,cx,cy,s*.95);g.addColorStop(0,col+"d0");g.addColorStop(1,col+"00");x.fillStyle=g;x.fillRect(cx-s,cy-s,s*2,s*2)});
L.forEach(r=>{const cx=(r.loc.c+.5)*s,cy=(r.loc.r+.5)*s;x.beginPath();x.arc(cx,cy,19,0,7);x.fillStyle="#060a14cc";x.fill();if(S.sel==r.loc.id){x.strokeStyle="#fff";x.lineWidth=2.5;x.stroke()}x.fillStyle="#fff";x.font="600 14px ui-monospace,monospace";x.textAlign="center";x.fillText(val(r),cx,cy+5)});
cv.onclick=e=>{const b=cv.getBoundingClientRect(),c=Math.floor((e.clientX-b.left)/b.width*5),r=Math.floor((e.clientY-b.top)/b.height*5);S.sel=r*5+c;render()}}
function render(){$("#tabs").innerHTML=TABS.map(([k,n])=>`<button data-t="${k}" class="${S.tab==k?"on":""}">${n}</button>`).join("");$("#app").innerHTML=V[S.tab]();
document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;render()});
document.querySelectorAll("[data-c]").forEach(r=>r.onclick=()=>{S.city=r.dataset.c;$("#city").value=S.city;ss("as_city",S.city);S.tab="dash";load()});const on=(i,ev,fn)=>{const e=$(i);if(e)e[ev]=fn};on("#layer","onchange",e=>{S.layer=e.target.value;render()});on("#zone","onchange",e=>{S.zone=e.target.value;render()});
on("#thr","oninput",e=>{S.thr=+e.target.value;ss("as_thr",S.thr);$("#tv").textContent=S.thr});on("#thr","onchange",()=>{check();render()});
on("#clr","onclick",()=>{S.alerts=[];ss("as_alerts",[]);render()});on("#nt","onclick",()=>{try{Notification.requestPermission().then(p=>toast("Notifications "+p))}catch(e){toast("Notifications are not available here","#f97316")}});
on("#cp","onclick",()=>{const t="area,zone,aqi,pm25,pm10,no2,co,temp,hum,wind\n"+latest().map(r=>[r.loc.name,r.loc.zone,r.aqi,r.pm25,r.pm10,r.no2,r.co,r.temp,r.hum,r.wind].join(",")).join("\n");navigator.clipboard.writeText(t).then(()=>toast("CSV copied")).catch(()=>toast("Copy is blocked in this view","#f97316"))});draw()}
async function load(){const st=await dbGet(S.city),n=new Date();n.setMinutes(0,0,0);if(st&&st.length==1800&&st.at(-1).ts==n.getTime())S.rows=st;else{S.rows=gen(S.city);dbSet(S.city,S.rows)}S.sel=null;derive();render();check()}
const buildSel=()=>$("#city").innerHTML=[...new Set(Object.values(CITIES).map(v=>v[5]))].map(g=>`<optgroup label="${g}">${Object.keys(CITIES).filter(c=>CITIES[c][5]==g).map(c=>`<option ${c==S.city?"selected":""}>${c}</option>`).join("")}</optgroup>`).join("");buildSel();
$("#city").onchange=e=>{S.city=e.target.value;ss("as_city",S.city);load()};
function useCoords(la,lo){let b,d=1e9;for(const c in CITIES){if(CITIES[c][5]=="My locations")continue;const v=(CITIES[c][0]-la)**2+(CITIES[c][1]-lo)**2;if(v<d){d=v;b=c}}const n="My location ("+f(la,2)+", "+f(lo,2)+")",B=CITIES[b];CITIES[n]=[la,lo,B[2],B[3],B[4],"My locations"];CU[n]=CITIES[n];ss("as_custom",CU);S.city=n;ss("as_city",n);buildSel();toast("Using your coordinates. Pollution baseline is modeled from nearby "+b+".");load()}
$("#geo").onclick=()=>{try{navigator.geolocation.getCurrentPosition(p=>useCoords(p.coords.latitude,p.coords.longitude),()=>{toast("Location is blocked in this view. Enter your coordinates, or open the page in its own tab and allow location.","#f97316");$("#cx").hidden=false},{timeout:8000})}catch(e){$("#cx").hidden=false}};
$("#cu").onclick=()=>{$("#cx").hidden=!$("#cx").hidden};
$("#go").onclick=()=>{const la=parseFloat($("#la").value),lo=parseFloat($("#lo").value);if(!(Math.abs(la)<=90&&Math.abs(lo)<=180))return toast("Enter a latitude from -90 to 90 and a longitude from -180 to 180.","#f97316");$("#cx").hidden=true;useCoords(la,lo)};
$("#ev").onclick=()=>{S.rows.slice(-75).forEach(r=>{if(r.loc.zone=="industrial"||r.loc.zone=="traffic"){r.pm25=+f(r.pm25*2.6,1);r.pm10=+f(r.pm10*2,1);r.no2=+f(r.no2*1.8,1);Object.assign(r,calc(r))}});dbSet(S.city,S.rows);derive();toast("Pollution event injected in traffic and industrial zones","#f97316");check();render()};
setInterval(()=>{latest().forEach(r=>{const j=1+(Math.random()-.5)*.08;r.pm25=+f(r.pm25*j,1);r.pm10=+f(r.pm10*j,1);Object.assign(r,calc(r))});derive();dbSet(S.city,S.rows);if(S.tab=="dash"||S.tab=="map")render();check()},20000);
load();
</script></body></html>
